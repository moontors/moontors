name: Bug report
description: Something in Moontors doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check the [open issues](https://github.com/moontors/moontors/issues) first, in case it's already known.

        **Leave out anything private:** API keys, tokens, and code or file paths you'd rather not share.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What went wrong, as plainly as you can put it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you thought Moontors would do instead.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that make it happen, if you know them.
      placeholder: |
        1. Create a session with …
        2. Ask it to …
        3. See …
  - type: input
    id: build
    attributes:
      label: Build
      description: The build line from Moontors' About window or `/status`. If Moontors won't open, the version you downloaded.
      placeholder: Moontors 0.1.0 (a1b2c3d)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux (AppImage)
        - Linux (.deb)
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Processor
      description: On macOS, Apple menu › About This Mac; on Windows, Settings › System › About.
      options:
        - arm64 (Apple silicon)
        - x64 (Intel or AMD)
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Version of the operating system
      placeholder: macOS 15.6 on Apple silicon, Windows 11 24H2, Ubuntu 24.04
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - More than one, or not about an agent
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Screenshots, logs or anything else
      description: Screenshots, or the error message Moontors showed. Drag images in here. The background service's log is `daemon.log` in the `.moontors` folder in your home folder; read it before attaching it, and leave out anything private.
